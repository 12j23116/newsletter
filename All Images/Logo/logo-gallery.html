<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Header Preview — TechNanoAI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0e1a;
    color: #e0e8f0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .page-title {
    text-align: center;
    margin-bottom: 40px;
  }

  .page-title h1 {
    font-size: 2rem;
    background: linear-gradient(135deg, #00f0ff, #0064dc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .page-title p {
    color: #7a8ba0;
    font-size: 0.95rem;
  }

  /* Each preview is a simulated website header bar */
  .header-previews {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .header-preview {
    background: linear-gradient(160deg, #111827, #0d1220);
    border: 1px solid #1a2540;
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
    cursor: pointer;
    position: relative;
  }

  .header-preview:hover {
    border-color: #00f0ff44;
    box-shadow: 0 8px 30px rgba(0, 240, 255, 0.1);
  }

  /* The simulated navbar */
  .sim-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    background: rgba(10, 14, 26, 0.95);
    border-bottom: 1px solid #1a2540;
  }

  .logo-icon-wrap {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
  }

  .logo-icon-wrap .logo-icon {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transform: scale(1.6);
  }

  .sim-header .brand-name {
    font-size: 1.15rem;
    font-weight: 700;
    background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  /* Simulated nav links */
  .sim-nav {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-left: auto;
  }

  .sim-nav span {
    font-size: 0.8rem;
    color: #5a6a80;
    white-space: nowrap;
  }

  /* Info row under each header */
  .preview-info {
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #111827;
  }

  .preview-info .label {
    font-size: 0.8rem;
    color: #5a6a80;
  }

  .preview-info .file-name {
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 0.72rem;
    color: #3a4a60;
  }

  /* Selected state */
  .header-preview.selected {
    border-color: #00f0ff;
    box-shadow: 0 0 0 2px rgba(0, 240, 255, 0.35), 0 8px 30px rgba(0, 240, 255, 0.15);
  }

  .header-preview.selected .label {
    color: #00f0ff;
  }

  /* Actions */
  .actions {
    max-width: 860px;
    margin: 40px auto 0;
    text-align: center;
  }

  .actions p {
    color: #5a6a80;
    font-size: 0.85rem;
  }

  .selected-display {
    margin-top: 10px;
    font-size: 0.95rem;
    color: #00f0ff;
    min-height: 22px;
  }

  /* Responsive: hide fake nav links on narrow screens */
  @media (max-width: 600px) {
    .sim-nav { display: none; }
  }
</style>
</head>
<body>

<div class="page-title">
  <h1>Logo Header Preview</h1>
  <p>How each icon looks in a header menu with the brand name — click to select</p>
</div>

<div class="header-previews" id="gallery">

  <div class="header-preview" data-name="Logo 1" data-file="download.jfif">
    <div class="sim-header">
      <div class="logo-icon-wrap"><img class="logo-icon" src="download.jfif" alt="TechNanoAI logo"></div>
      <span class="brand-name">TechNanoAI</span>
      <div class="sim-nav">
        <span>AI</span><span>Robotics</span><span>Fusion</span><span>Space</span><span>Quantum</span>
      </div>
    </div>
    <div class="preview-info">
      <span class="label">Option 1</span>
      <span class="file-name">download.jfif</span>
    </div>
  </div>

  <div class="header-preview" data-name="Logo 3" data-file="download (2).jfif">
    <div class="sim-header">
      <div class="logo-icon-wrap"><img class="logo-icon" src="download (2).jfif" alt="TechNanoAI logo"></div>
      <span class="brand-name">TechNanoAI</span>
      <div class="sim-nav">
        <span>AI</span><span>Robotics</span><span>Fusion</span><span>Space</span><span>Quantum</span>
      </div>
    </div>
    <div class="preview-info">
      <span class="label">Option 3</span>
      <span class="file-name">download (2).jfif</span>
    </div>
  </div>

</div>

<div class="actions">
  <p>Click any header preview to mark it as your selected choice</p>
  <div class="selected-display" id="selectedDisplay"></div>
</div>

<script>
  const cards = document.querySelectorAll('.header-preview');
  const selectedDisplay = document.getElementById('selectedDisplay');

  cards.forEach(card => {
    card.addEventListener('click', () => {
      cards.forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      const name = card.dataset.name;
      const file = card.dataset.file;
      selectedDisplay.textContent = `Selected: ${name} — ${file}`;
    });
  });
</script>

</body>
</html>
